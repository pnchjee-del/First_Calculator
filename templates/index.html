<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #1e1e24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .calculator {
      background: #2b2d42;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 320px;
    }
    .display {
      background: #111425;
      color: #edf2f4;
      font-size: 2.2rem;
      text-align: right;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      overflow-x: auto;
      white-space: nowrap;
      min-height: 70px;
      line-height: 38px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      cursor: pointer;
      color: #edf2f4;
      background: #3d405b;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active {
      transform: scale(0.96);
      opacity: 0.8;
    }
    button.op {
      background: #e07a5f;
    }
    button.equals {
      background: #81b29a;
      grid-column: span 2;
    }
    button.clear {
      background: #d90429;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>
    <div class="keypad">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="op" onclick="appendChar('/')">÷</button>
      <button class="op" onclick="appendChar('*')">×</button>

      <button onclick="appendChar('7')">7</button>
      <button onclick="appendChar('8')">8</button>
      <button onclick="appendChar('9')">9</button>
      <button class="op" onclick="appendChar('-')">-</button>

      <button onclick="appendChar('4')">4</button>
      <button onclick="appendChar('5')">5</button>
      <button onclick="appendChar('6')">6</button>
      <button class="op" onclick="appendChar('+')">+</button>

      <button onclick="appendChar('1')">1</button>
      <button onclick="appendChar('2')">2</button>
      <button onclick="appendChar('3')">3</button>
      <button onclick="appendChar('.')">.</button>

      <button onclick="appendChar('0')">0</button>
      <button class="equals" onclick="compute()">=</button>
    </div>
  </div>

  <script>
    let currentExpression = "";
    const display = document.getElementById("display");

    function updateDisplay(val) {
      display.textContent = val || "0";
    }

    function appendChar(char) {
      if (currentExpression === "0" && char !== ".") {
        currentExpression = char;
      } else {
        currentExpression += char;
      }
      updateDisplay(currentExpression);
    }

    function clearDisplay() {
      currentExpression = "";
      updateDisplay("0");
    }

    function deleteLast() {
      currentExpression = currentExpression.slice(0, -1);
      updateDisplay(currentExpression);
    }

    async function compute() {
      if (!currentExpression) return;
      try {
        const response = await fetch("/calculate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ expression: currentExpression })
        });
        const data = await response.json();
        currentExpression = data.result.startsWith("Error") ? "" : data.result;
        updateDisplay(data.result);
      } catch (err) {
        updateDisplay("Error");
        currentExpression = "";
      }
    }
  </script>
</body>
</html>
